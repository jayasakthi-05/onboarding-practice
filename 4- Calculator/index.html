<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
    <style>

        body{
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            background:#f2f2f2;
            font-family:Arial, sans-serif;
        }

        .calculator{
            width:300px;
            background:#222;
            padding:20px;
            border-radius:10px;
        }

        #display{
            width:100%;
            height:60px;
            font-size:28px;
            text-align:right;
            margin-bottom:15px;
            border:none;
            border-radius:5px;
            padding-right:10px;
            box-sizing:border-box;
        }

        .buttons{
            display:grid;
            grid-template-columns:repeat(4,1fr);
            gap:10px;
        }

        button{
            height:60px;
            font-size:22px;
            border:none;
            border-radius:5px;
            cursor:pointer;
        }

        button:hover{
            background:#ddd;
        }

        .operator{
            background:orange;
            color:white;
        }

        .equal{
            background:green;
            color:white;
        }

        .clear{
            background:red;
            color:white;
        }

    </style>

</head>
<body>
    
    <div class="calculator">
    <input type="text" id="display" value="0" readonly>
    <div class="buttons">
    <button class="clear">C</button>
    <button class="operator">/</button>
    <button class="operator">*</button>
    <button class="operator">-</button>

<button>7</button>
<button>8</button>
<button>9</button>
<button class="operator">+</button>

<button>4</button>
<button>5</button>
<button>6</button>
<button>.</button>

<button>1</button>
<button>2</button>
<button>3</button>
<button class="equal">=</button>

<button style="grid-column: span 4;">0</button>

</div>

<script src="calculator.js" defer></script>

</body>
</html>
